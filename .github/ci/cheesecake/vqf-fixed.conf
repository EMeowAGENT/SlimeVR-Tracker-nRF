# 变体：关闭 VQF 自适应 tauAcc（使用固定时间常数）
#
# prj.conf 里 CONFIG_VQF_ADAPTIVE_TAU_ACC=y（Kconfig 默认是 n），
# 所以这个变体是把它关掉，用于 A/B 对比。
#
# Kconfig 原文：
#   "This improves measured drift but can worsen inclination under
#    simultaneous rotation and translation."
#
# 关闭后 tauAcc 固定为 3.264 s（启动值），不再在 0.5~8 s 之间自适应。
# CONFIG_VQF_ADAPTIVE_TAU_ACC is not set
