# 变体：禁用自动休眠（WOM）与活动超时
#
# 目的
#  1) 规避 power.c 里 heater_power_terminal 的单向锁：WOM 一旦提交就置位，
#     且本次开机内永不清除，导致 sensor_tcal_heated_start() 永久返回 -ESHUTDOWN。
#  2) 规避"空闲 -> WOM -> 射频停止 -> 接收器清影子"的掉线。
#
# 代价：续航明显下降，适合桌面 / 插电使用。
# 注意：长按按钮关机（USER_SHUTDOWN）仍然有效。
# CONFIG_USE_IMU_WAKE_UP is not set
# CONFIG_USE_ACTIVE_TIMEOUT is not set
