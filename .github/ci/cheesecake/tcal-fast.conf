# 变体：放宽加热校准的静止驻留要求（首点专用实验）
#
# 问题：默认 RESUME_STABLE_MS=5000 要求连续静止 5 s 才开始采样，
# 而桌面震动下的静止窗口中位只有 ~3 s，导致 sampling 永远不启动、
# 首点永远采不到（END: NO_TCAL_COVERAGE）。
#
# 该变体把驻留降到 1 s，让 3 s 的静止窗口也能贡献样本；
# 台架/桌面场景专用，正常使用请刷基线固件。
CONFIG_SENSOR_TCAL_HEATED_RESUME_STABLE_MS=1000

# trigger 1647

# 该单机在 70% 占空比下热平衡只有 43 °C，达不到默认目标 44 °C，
# 会一直顶在功率上限直到 90 min 超时。目标降到 42 °C 让它能真正完成，
# 覆盖范围仍可从 29.4 °C 扩展到 42 °C。
CONFIG_SENSOR_TCAL_HEATED_DEFAULT_TARGET_C=42
